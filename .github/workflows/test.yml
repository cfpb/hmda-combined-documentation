name: E2E tests

on:
  pull_request:

run-name: "E2E tests: branch ${{ github.head_ref }} by @${{ github.actor }}"

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run site and Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: yarn start
          wait-on: http://localhost:3000
          wait-on-timeout: 180
          command: yarn cypress run